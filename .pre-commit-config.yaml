repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key

  - repo: local
    hooks:
      - id: secret-guard
        name: secret guard (tracked paths and contents)
        entry: scripts/check-secrets.sh
        language: system
        pass_filenames: false
        always_run: true
