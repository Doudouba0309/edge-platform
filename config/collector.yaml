gateway_id: dev-gateway-01
log_level: INFO
log_json: false
log_file: var/collector.log

batching:
  queue_max: 1000
  overflow_policy: drop_oldest
  max_samples: 10
  flush_interval_s: 1.0

health:
  enabled: true
  host: 127.0.0.1
  port: 8081

sink:
  kind: log

spool:
  enabled: false

sources:
  synthetic:
    enabled: true
    device_id: plc-line-1
    interval_s: 0.5
    metrics:
      - name: temperature
        value: 25.0
        step: 0.5
        unit: degC
      - name: pressure
        value: 101.3
        step: 0.0
        unit: kPa
