gateway_id: dev-gateway-01
log_level: INFO
log_json: false
status_enabled: false

batching:
  queue_max: 1000
  overflow_policy: drop_oldest
  max_samples: 10
  flush_interval_s: 0.5

health:
  enabled: true
  host: 127.0.0.1
  port: 8081

sink:
  kind: mqtt
  host: 127.0.0.1
  port: 8883
  client_id: dev-gateway-01
  qos: 1
  ca_file: certs/ca.crt
  cert_file: certs/client.crt
  key_file: certs/client.key
  keepalive_s: 30
  connect_timeout_s: 2.0
  publish_timeout_s: 2.0

spool:
  enabled: true
  path: var/spool.sqlite3
  max_bytes: 1048576
  replay_interval_s: 0.5

sources:
  synthetic:
    enabled: true
    device_id: plc-line-1
    interval_s: 0.2
    metrics:
      - name: temperature
        value: 25.0
        step: 0.5
        unit: degC
      - name: pressure
        value: 101.3
        step: 0.0
        unit: kPa
