[project]
name = "edge-collector"
version = "0.1.0"
description = "Edge Platform telemetry contract and collector base"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "paho-mqtt>=2.1,<3",
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
aws = [
    "awsiotsdk>=1.22,<2",
]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
edge-collector = "edge_collector.__main__:main"
edge-collector-support = "edge_collector.support:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["paho.*", "awsiot.*"]
ignore_missing_imports = true
