name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - name: Install
        run: make install
      - name: Check
        run: make check

  smoke:
    name: Tier 1 smoke (arm64 + x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CACHE_BACKEND: gha
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - name: Install broker client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mosquitto-clients
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Install
        run: make install
      - name: Local mTLS and spool smoke
        run: make verify
      - name: Build and boot both Tier 1 images
        run: make smoke
      - name: Generate CycloneDX SBOMs
        run: make sbom
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: var/sbom/*.cdx.json
          if-no-files-found: error

  nucleus:
    name: Greengrass nucleus (arm64 + x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CACHE_BACKEND: gha
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify the offline nucleus
        run: make nucleus-smoke
      - name: Generate nucleus SBOMs
        run: make sbom-nucleus
      - name: Upload nucleus SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-nucleus
          path: var/sbom/*.cdx.json
          if-no-files-found: error
