name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - name: Install
        run: make install
      - name: Check
        run: make check

  smoke:
    name: Tier 1 smoke (arm64 + x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - name: Install broker client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mosquitto-clients
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Install
        run: make install
      - name: Local mTLS and spool smoke
        run: make verify
      - name: Build and boot both Tier 1 images
        run: make smoke
